<body>
    <h1 id="contact-info">Contact Me</h1>
    <section class="contact-section contact-section-info">
        <p class="contact-subtitle">Let's build something amazing together.</p>
        <div class="contact-info-row">
            <div class="contact-info-item">Phone: +1 (573)-645-3872</div>
            <div class="contact-info-item">Email: annamarkway@outlook.com</div>
            <a href="https://www.linkedin.com/in/anna-markway-784962344/" class="doc-btn" target="_blank" rel="noopener">Connect on LinkedIn</a>
        </div>
    </section>

    <h1 id="contact-form">Get in Touch</h1>
    <section class="contact-section contact-section-form">
        <form action="" class="contact-form">
            <div class="form-field">
                <label class="form-label">I am a...</label>
                <select class="contact-select">
                    <option>Student</option>
                    <option>Recruiter</option>
                    <option>Hiring manager</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-field">
                <label class="form-label">Reason for reaching out</label>
                <select class="contact-select">
                    <option>Propose project collaboration</option>
                    <option>Encourage application to job position</option>
                    <option>Other</option>
                </select>
            </div>

            <input type="text" placeholder="Name" class="contact-input" required>
            <input type="email" placeholder="Email" class="contact-input" required>
            <input type="text" placeholder="Subject" class="contact-input">
            <textarea placeholder="Message" class="contact-textarea" required></textarea>

            <button type="submit" class="doc-btn contact-submit">Submit</button>
        </form>
    </section>

    <h1 id="schedule">Schedule a Chat</h1>
    <section class="contact-section">
        <div class="calendly-inline-widget" data-url="https://calendly.com/ammarkway/30min" style="height:700px;"></div>
        <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
    </section>
</body>
