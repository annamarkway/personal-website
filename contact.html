    <h1 id="contact-info">Contact Me</h1>
    <section class="contact-section contact-section-info">
        <p class="contact-subtitle">Let's build something amazing together.</p>
        <div class="contact-info-row">
            <div class="contact-info-item">Email: annamarkway@outlook.com</div>
            <a href="https://www.linkedin.com/in/anna-markway-784962344/" class="doc-btn" target="_blank" rel="noopener" data-track="linkedin-click">Connect on LinkedIn</a>
        </div>
    </section>

    <h1 id="contact-form">Get in Touch</h1>
    <section class="contact-section contact-section-form">
        <form id="contact-form-el" action="https://formspree.io/f/mkjnwbjd" method="POST" class="contact-form">
            <input type="text" name="_gotcha" class="form-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
            <input type="hidden" name="_subject" value="New message via personal site">
            <div class="form-field">
                <label class="form-label">I am a...</label>
                <select class="contact-select" name="audience">
                    <option>Student</option>
                    <option>Recruiter</option>
                    <option>Hiring manager</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-field">
                <label class="form-label">Reason for reaching out</label>
                <select class="contact-select" name="reason">
                    <option>Internship or full-time opportunity</option>
                    <option>Propose project collaboration</option>
                    <option>Encourage application to job position</option>
                    <option>Other</option>
                </select>
            </div>

            <input type="text" placeholder="Name" class="contact-input" name="name" required>
            <input type="email" placeholder="Email" class="contact-input" name="email" required>
            <input type="text" placeholder="Subject" class="contact-input" name="subject">
            <textarea placeholder="Message" class="contact-textarea" name="message" required></textarea>

            <button type="submit" class="doc-btn contact-submit">Submit</button>
            <p id="contact-status" class="contact-status" role="status"></p>
        </form>
    </section>

    <h1 id="schedule">Schedule a Chat</h1>
    <section class="contact-section">
