name: Check portfolio.json

on:
  push:
    paths: ['portfolio.json', 'filters.json', 'index.html', 'scripts/check-portfolio.mjs', 'scripts/portfolio-rules.js']
  pull_request:
    paths: ['portfolio.json', 'filters.json', 'index.html', 'scripts/check-portfolio.mjs', 'scripts/portfolio-rules.js']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-portfolio.mjs
